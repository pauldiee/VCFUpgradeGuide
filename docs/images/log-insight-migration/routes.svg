<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 904" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Log Insight to Log Management 9.1: which route each part takes</title>
<desc id="d">For each part of an Aria Operations for Logs 8.x (Log Insight) instance, the route to VCF Operations 9.1 with Log Management and where it ends up. Forwarding rules: Import at deploy, Tick "Import configuration" in the deploy wizard, ends up as Log Forwarding: copied but inactive, activate by hand. Logs on the old cluster: Import at deploy, Connect the old cluster in the same deploy, ends up as Logs page, legacy partition: queryable for 90 days. Up to 90 days of logs (copy): Log data tools, Logs Data Transfer (SSH 22 to every old node), ends up as Log Management log store. Archived logs (NFS): Log data tools, Archive import, type "legacy import" (NFS only), ends up as Import partition: one archive active at a time. Custom alerts: Content pack to management pack, Export content pack, run converter, install .pak, ends up as Management pack: Alert Definitions. Custom dashboards: Content pack to management pack, Same content pack and .pak, ends up as Management pack: dashboards. Saved queries, extracted fields: Content pack to management pack, Include them in the content pack, ends up as Result not documented: check after install. Third-party content packs: Content pack to management pack, Run the converter on the pack file, ends up as Content-only management pack. Agents and log sources: Re-point by hand, Point them at the new FQDN, ends up as Log Collection (old cluster collects until then). Forwarders sending to Log Insight: Re-point by hand, Point them at the new FQDN, ends up as Log Management ingestion. Users, roles, AD, data sets: Not documented: rebuild, Recreate in VCF Operations, ends up as Access Control: roles, scopes, data sets.</desc>
