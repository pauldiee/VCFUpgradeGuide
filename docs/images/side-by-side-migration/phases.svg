<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 900" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Side-by-side migration: seven phases, each with a check</title>
<desc id="d">Side-by-side migration in seven phases, each with what you do, the tools, and the check that must pass before the next phase. Phase 0, Decide the route: Five questions: HCX, IP addresses, NSX, VDS versions, identity. Tools: Baseline exports of the source. Check: Route chosen and written down before anything is built. Phase 1, Build the target: New VCF or VVF 9 environment, HCX on both sides if chosen. Tools: Deployment planning guide. Check: Target healthy, licensed, reachable from the source. Phase 2, Carry over vCenter configuration: Roles, tags, storage policies, folders and folder permissions. Tools: VIRoleManager, Tags + attributes (in dev.), StoragePolicyManager, VIFolderManager (in test). Check: Every role, tag, policy and folder exists on the target, same names. Phase 3, Carry over networks and firewall: Port groups, NSX segments, NSX DFW policies, before the first VM moves. Tools: VDSPortGroupManager, nsx-segment-migration, NSX DFW toolkit (J. Buren). Check: Every source network mapped, DFW comparison shows nothing missing. Phase 4, Prove the path: Ports, HCX diagnostics, one test VM there and back. Tools: Ports 8000 / 902 / 443, HCX Diagnostics. Check: Test VM runs on the target with network, policy, tags, folder. Phase 5, Migrate in waves: With HCX: Mobility Groups Without: Import VMs (Adv. Cross vCenter vMotion). Tools: VIFolderManager (in test), Tags + attributes (in dev.), NSX VM tags (DFW toolkit). Check: Wave checked by the application owner before the next wave. Phase 6, Cut over and clean up: Gateways to the target, remove network extensions, retire source. Tools: none. Check: Nothing left running on the source environment.</desc>
