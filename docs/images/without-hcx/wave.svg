<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 640" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">A migration wave without HCX</title>
<desc id="d">A migration wave without HCX in five steps. 1, Before: Export the wave's tag assignments. Check the VMs. Agree the window. 2, Migrate: Import VMs (target), Export (source), or PowerCLI Move-VM. 3, After: Folders, vSphere tags, NSX tags. Check policy and custom attributes. 4, Check: Application owner tests. Network, policy, tags, folder per VM. 5, Sign off: Wave done. Remove copies left by 'Keep VMs on the source'. After sign-off, the next wave starts at step 1. If a check fails, move the VM back. In step 2 choose per VM: compute, storage and policy, folder, network. Keep virtual hardware and VMware Tools as they are until sign-off. Per host two migrations run at a time, per datastore eight; the rest is queued.</desc>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker></defs>
<rect width="1260" height="640" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="630.0" y="40" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">A migration wave without HCX</text>
<text x="630.0" y="64" font-size="13" fill="#475569" text-anchor="middle">Advanced Cross vCenter vMotion. Every wave runs the same five steps; the next wave starts after sign-off.</text>
<rect x="40" y="120" width="212" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<circle cx="68" cy="150" r="16" fill="#2563eb"/><text x="68" y="156" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="94" y="156" font-size="17" font-weight="700" fill="#0f172a">Before</text>
<text x="58" y="196" font-size="13.5" fill="#1e293b">Export the wave's tag</text>
<text x="58" y="217" font-size="13.5" fill="#1e293b">assignments. Check the VMs.</text>
<text x="58" y="238" font-size="13.5" fill="#1e293b">Agree the window.</text>
<path d="M254 195.0 H278" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#m)"/>
<rect x="282" y="120" width="212" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<circle cx="310" cy="150" r="16" fill="#dc2626"/><text x="310" y="156" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="336" y="156" font-size="17" font-weight="700" fill="#0f172a">Migrate</text>
<text x="300" y="196" font-size="13.5" fill="#1e293b">Import VMs (target),</text>
<text x="300" y="217" font-size="13.5" fill="#1e293b">Export (source), or</text>
<text x="300" y="238" font-size="13.5" fill="#1e293b">PowerCLI Move-VM.</text>
<path d="M496 195.0 H520" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#m)"/>
<rect x="524" y="120" width="212" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<circle cx="552" cy="150" r="16" fill="#dc2626"/><text x="552" y="156" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="578" y="156" font-size="17" font-weight="700" fill="#0f172a">After</text>
<text x="542" y="196" font-size="13.5" fill="#1e293b">Folders, vSphere tags,</text>
<text x="542" y="217" font-size="13.5" fill="#1e293b">NSX tags. Check policy</text>
<text x="542" y="238" font-size="13.5" fill="#1e293b">and custom attributes.</text>
<path d="M738 195.0 H762" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#m)"/>
<rect x="766" y="120" width="212" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<circle cx="794" cy="150" r="16" fill="#2563eb"/><text x="794" y="156" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="820" y="156" font-size="17" font-weight="700" fill="#0f172a">Check</text>
<text x="784" y="196" font-size="13.5" fill="#1e293b">Application owner tests.</text>
<text x="784" y="217" font-size="13.5" fill="#1e293b">Network, policy, tags,</text>
<text x="784" y="238" font-size="13.5" fill="#1e293b">folder per VM.</text>
<path d="M980 195.0 H1004" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#m)"/>
<rect x="1008" y="120" width="212" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
<circle cx="1036" cy="150" r="16" fill="#16a34a"/><text x="1036" y="156" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="1062" y="156" font-size="17" font-weight="700" fill="#0f172a">Sign off</text>
<text x="1026" y="196" font-size="13.5" fill="#1e293b">Wave done.</text>
<text x="1026" y="217" font-size="13.5" fill="#1e293b">Remove copies left by</text>
<text x="1026" y="238" font-size="13.5" fill="#1e293b">'Keep VMs on the source'.</text>
<path d="M1114.0 270 V316 H146.0 V276" stroke="#16a34a" stroke-width="2.2" fill="none" stroke-dasharray="7 5" marker-end="url(#g)"/>
<text x="630.0" y="308" font-size="13.5" fill="#166534" text-anchor="middle" font-weight="700">next wave</text>
<path d="M872.0 120 V98 H388.0 V116" stroke="#d97706" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
<text x="630.0" y="90" font-size="13.5" fill="#92400e" text-anchor="middle" font-weight="700">check fails: move the VM back the same way</text>
<rect x="40" y="352" width="1180" height="128" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
<text x="60" y="380" font-size="14.5" font-weight="700" fill="#0f172a">In step 2, per VM, from the mapping tables of phases 2 and 3</text>
<rect x="60.0" y="396" width="269.0" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="74.0" y="422" font-size="14" font-weight="700" fill="#0f172a">Compute</text>
<text x="74.0" y="445" font-size="12.5" fill="#334155">cluster, or a host when DRS is off</text>
<rect x="345.0" y="396" width="269.0" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="359.0" y="422" font-size="14" font-weight="700" fill="#0f172a">Storage</text>
<text x="359.0" y="445" font-size="12.5" fill="#334155">datastore, disk format, storage policy</text>
<rect x="630.0" y="396" width="269.0" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="644.0" y="422" font-size="14" font-weight="700" fill="#0f172a">Folder</text>
<text x="644.0" y="445" font-size="12.5" fill="#334155">from the folder export</text>
<rect x="915.0" y="396" width="269.0" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="929.0" y="422" font-size="14" font-weight="700" fill="#0f172a">Network</text>
<text x="929.0" y="445" font-size="12.5" fill="#334155">per source network or per adapter</text>
<text x="48" y="516" font-size="13.5" fill="#334155">&#8226; Keep virtual hardware and VMware Tools as they are until the wave is signed off: it keeps the way back open.</text>
<text x="48" y="540" font-size="13.5" fill="#334155">&#8226; Per host 2 migrations run at a time, per datastore 8; vCenter queues the rest. Spread a wave over hosts and datastores.</text>
<text x="48" y="564" font-size="13.5" fill="#334155">&#8226; Encrypted VMs need the vSphere API and a shared key provider; the wizard doesn't do them.</text>
<rect x="48" y="600" width="22" height="16" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="78" y="613" font-size="12.5" fill="#334155">No change to VMs</text>
<rect x="308" y="600" width="22" height="16" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="338" y="613" font-size="12.5" fill="#334155">Changes VMs on the target</text>
<rect x="568" y="600" width="22" height="16" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="598" y="613" font-size="12.5" fill="#334155">Done</text>
</svg>
