<text x="92" y="577" font-size="15" font-weight="700" fill="#0f172a">NSX distributed firewall</text>
<text x="92" y="600" font-size="13" fill="#334155">IP sets, services, groups,</text>
<text x="92" y="619" font-size="13" fill="#334155">profiles, policies, rules</text>
