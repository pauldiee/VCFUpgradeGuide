<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 782" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Carrying over the networks and the firewall</title>
<desc id="d">Carrying over the networks and the firewall. Step 1: a network mapping table built from the networks VMs use. Step 2, VDS port groups (On the source VDS): VDSPortGroupManager. Export zip, import on target VDS. Uplink names must match; names unique per datacenter. Target: VDS port groups VLAN per mapping table. Step 3, NSX segments + profiles (VLAN or overlay): nsx-segment-migration. Edit name CSV, pick transport zone, dry run, import. Overlay needs gateway and subnet. Target: NSX segments profiles bound. Networks HCX extends (IPs kept with HCX): HCX Network Extension. Not recreated by hand. No second gateway for the same subnet until the cutover. Target: Extended network one gateway. Step 4, NSX distributed firewall (IP sets, services, groups, profiles, policies, rules): NSX DFW toolkit (J. Buren). Export, sanitize, review, import -WhatIf, import, compare. After step 3, before any VM. Target: DFW on target nothing missing. VM NSX tags follow per wave in phase 5.</desc>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1260" height="782" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="630.0" y="40" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Carrying over the networks and the firewall</text>
<text x="630.0" y="64" font-size="13" fill="#475569" text-anchor="middle">Everything here exists on the target before the first VM moves. Numbers are the steps on this page.</text>
<rect x="40" y="86" width="1180" height="46" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
<circle cx="68" cy="109" r="15" fill="#334155"/><text x="68" y="114" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="96" y="114" font-size="14.5" fill="#0f172a"><tspan font-weight="700">Network mapping table</tspan>: one row per network VMs actually use. Source, VLAN, subnet and gateway, target, route, waves, DFW groups.</text>
<text x="190.0" y="170" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Source</text>
<text x="615.0" y="170" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Route and toolkit</text>
<text x="1055.0" y="170" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Target</text>
<rect x="24" y="180" width="1212" height="118" fill="#f8fafc"/>
<rect x="40" y="190" width="300" height="98" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<circle cx="68" cy="218" r="15" fill="#334155"/><text x="68" y="223" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="92" y="223" font-size="15" font-weight="700" fill="#0f172a">VDS port groups</text>
<text x="92" y="246" font-size="13" fill="#334155">On the source VDS</text>
