<text x="509" y="220" font-size="12.5" fill="#0f172a" text-anchor="middle">VDSPortGroupManager</text>
<text x="396" y="246" font-size="13" fill="#0f172a">Export zip, import on target VDS.</text>
<text x="396" y="264" font-size="13" fill="#0f172a">Uplink names must match; names</text>
<text x="396" y="282" font-size="13" fill="#0f172a">unique per datacenter.</text>
