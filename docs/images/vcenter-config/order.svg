<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 784" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Carrying over the vCenter configuration: what goes now, what goes per wave</title>
<desc id="d">Carrying over the vCenter configuration in five steps. Before you start: PowerShell 7.4 or later with VCF.PowerCLI 9, the target joined to the same directory, one working folder for all exports. Step 1, Roles, tool VIRoleManager. Phase 2 on the target: Custom roles created; skipped privileges reviewed. Phase 5 per wave: Nothing per VM. Step 2, Tag categories and tags, tool Tags + attributes (in dev.). Phase 2 on the target: Categories and tags, same cardinality and entity types. Phase 5 per wave: Export assignments before the wave, apply after: they don't follow the VM. Step 3, Custom attributes, tool Tags + attributes (in dev.). Phase 2 on the target: Attribute names created, same target type. Phase 5 per wave: Check the values arrived (KB 344959: they do if the name exists). Step 4, Storage policies, tool StoragePolicyManager. Phase 2 on the target: Imported or mapped to a target policy; skipped rules reviewed. Phase 5 per wave: Check each VM against the policy mapping. Step 5, Folders and permissions, tool VIFolderManager (in test). Phase 2 on the target: Folder trees and folder permissions; no objects moved. Phase 5 per wave: Import with -MoveObjects puts arrived VMs in their folders. Dependencies: folder permissions need the roles from step 1; tag-based storage policy rules need the tags from step 2.</desc>
